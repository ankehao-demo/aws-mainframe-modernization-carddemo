# Application
spring.application.name=carddemo

# Database - PostgreSQL (default profile)
spring.datasource.url=jdbc:postgresql://localhost:5432/carddemo
spring.datasource.username=carddemo
spring.datasource.password=carddemo
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=cardDemoSecretKeyForJWTTokenGenerationAndValidation2024PleaseChangeInProduction
jwt.expiration-ms=86400000

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Server
server.port=8080

# Spring Batch
spring.batch.jdbc.initialize-schema=always
