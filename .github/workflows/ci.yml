name: CardDemo Java + Angular CI

on:
  push:
    branches: [ main ]
    paths:
      - 'carddemo-java/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'carddemo-java/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carddemo-java/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean verify -B

      - name: Check JaCoCo Coverage
        run: |
          if [ -f target/site/jacoco/jacoco.xml ]; then
            echo "JaCoCo report generated successfully"
          else
            echo "ERROR: JaCoCo report not found"
            exit 1
          fi

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: carddemo-java/backend/target/site/jacoco/

      - name: Upload Surefire Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: carddemo-java/backend/target/surefire-reports/

      - name: Upload Failsafe Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: carddemo-java/backend/target/failsafe-reports/

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carddemo-java/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: carddemo-java/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test with Coverage
        run: npm test

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: carddemo-java/frontend/coverage/

      - name: Upload Karma Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karma-results
          path: carddemo-java/frontend/coverage/
