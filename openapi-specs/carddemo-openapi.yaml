                  type: string
                  maxLength: 1
                  x-cobol-pic: X
                codatecn1mm:
                  type: string
                  maxLength: 2
                  x-cobol-pic: XX
                codatecn1iS2:
                  type: string
                  maxLength: 1
                  x-cobol-pic: X
                codatecn2yy:
                  type: string
                  maxLength: 2
                  x-cobol-pic: XX
                codatecn2fil:
                  type: string
                  maxLength: 10
