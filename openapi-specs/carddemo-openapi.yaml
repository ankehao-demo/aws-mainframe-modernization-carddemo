openapi: 3.0.3
info:
  title: CardDemo COBOL Copybook API
  version: 1.0.0
  description: Auto-generated OpenAPI specification from COBOL copybook data structures in the AWS CardDemo mainframe modernization
    application. Each schema corresponds to a COBOL 01-level record definition.
paths: {}
components:
  schemas:
    CarddemoAdminMenuOptions:
      type: object
      x-source-copybook: COADM02Y.cpy
    CarddemoCommarea:
      type: object
      x-source-copybook: COCOM01Y.cpy
      properties:
        cdemoGeneralInfo:
          type: object
          properties:
            cdemoFromTranid:
              type: string
              maxLength: 4
              x-cobol-pic: X(04)
            cdemoFromProgram:
              type: string
              maxLength: 8
              x-cobol-pic: X(08)
            cdemoToTranid:
              type: string
              maxLength: 4
              x-cobol-pic: X(04)
            cdemoToProgram:
              type: string
              maxLength: 8
              x-cobol-pic: X(08)
            cdemoUserId:
              type: string
              maxLength: 8
              x-cobol-pic: X(08)
            cdemoUserType:
              type: string
              maxLength: 1
              x-conditions:
              - name: CDEMO-USRTYP-ADMIN
                values:
                - A
              - name: CDEMO-USRTYP-USER
                values:
                - U
              enum:
              - A
              - U
              x-cobol-pic: X(01)
            cdemoPgmContext:
              type: integer
              x-cobol-pic: 9(01)
              x-conditions:
              - name: CDEMO-PGM-ENTER
                values:
                - 0
              - name: CDEMO-PGM-REENTER
                values:
                - 1
              enum:
              - 0
              - 1
          required:
          - cdemoFromTranid
          - cdemoFromProgram
          - cdemoToTranid
          - cdemoToProgram
          - cdemoUserId
          - cdemoUserType
          - cdemoPgmContext
        cdemoCustomerInfo:
          type: object
          properties:
            cdemoCustId:
              type: integer
              x-cobol-pic: 9(09)
            cdemoCustFname:
              type: string
              maxLength: 25
              x-cobol-pic: X(25)
            cdemoCustMname:
              type: string
              maxLength: 25
              x-cobol-pic: X(25)
            cdemoCustLname:
              type: string
              maxLength: 25
              x-cobol-pic: X(25)
          required:
          - cdemoCustId
          - cdemoCustFname
          - cdemoCustMname
          - cdemoCustLname
        cdemoAccountInfo:
          type: object
          properties:
            cdemoAcctId:
              type: integer
              x-cobol-pic: 9(11)
            cdemoAcctStatus:
              type: string
              maxLength: 1
              x-cobol-pic: X(01)
          required:
          - cdemoAcctId
          - cdemoAcctStatus
        cdemoCardInfo:
          type: object
          properties:
            cdemoCardNum:
              type: integer
              x-cobol-pic: 9(16)
          required:
          - cdemoCardNum
        cdemoMoreInfo:
          type: object
          properties:
            cdemoLastMap:
              type: string
              maxLength: 7
              x-cobol-pic: X(7)
            cdemoLastMapset:
              type: string
              maxLength: 7
              x-cobol-pic: X(7)
          required:
          - cdemoLastMap
          - cdemoLastMapset
      required:
      - cdemoGeneralInfo
      - cdemoCustomerInfo
      - cdemoAccountInfo
      - cdemoCardInfo
      - cdemoMoreInfo
