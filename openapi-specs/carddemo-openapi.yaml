              - codatecn1oYyyy
              - codatecn1iS1
              - codatecn1mm
              - codatecn1iS2
              - codatecn2yy
              - codatecn2fil
              x-redefines: CODATECN-INP-DATE
          required:
          - codatecnType
          - codatecnInpDate
          - codatecn1inp
          - codatecn2inp
        codatecnOutRec:
          type: object
          properties:
            codatecnOuttype:
              type: string
              maxLength: 1
              x-conditions:
              - name: YYYY-MM-DD-OP
                values:
                - '"1"'
              - name: YYYYMMDD-OP
                values:
                - '"2"'
              enum:
              - '"1"'
              - '"2"'
              x-cobol-pic: X
            codatecn0utDate:
              type: string
              maxLength: 20
              x-cobol-pic: X(20)
            codatecn1out:
              type: object
              properties:
                codatecn1oYyyy:
                  type: string
                  maxLength: 4
                  x-cobol-pic: XXXX
                codatecn1oS1:
                  type: string
                  maxLength: 1
                  x-cobol-pic: X
                codatecn1oMm:
                  type: string
                  maxLength: 2
                  x-cobol-pic: XX
                codatecn1oS2:
                  type: string
                  maxLength: 1
                  x-cobol-pic: X
                codatecn1oDd:
                  type: string
                  maxLength: 2
                  x-cobol-pic: XX
                codatecn1ofil:
                  type: string
                  maxLength: 10
                  x-cobol-pic: X(10)
              required:
              - codatecn1oYyyy
              - codatecn1oS1
              - codatecn1oMm
              - codatecn1oS2
              - codatecn1oDd
              - codatecn1ofil
              x-redefines: CODATECN-0UT-DATE
            codatecn2out:
              type: object
              properties:
                codatecn2oYyyy:
                  type: string
                  maxLength: 4
                  x-cobol-pic: XXXX
                codatecn2oMm:
                  type: string
                  maxLength: 2
                  x-cobol-pic: XX
                codatecn2oDd:
                  type: string
                  maxLength: 2
                  x-cobol-pic: XX
                codatecn2ofil:
                  type: string
                  maxLength: 12
                  x-cobol-pic: X(12)
              required:
              - codatecn2oYyyy
              - codatecn2oMm
              - codatecn2oDd
              - codatecn2ofil
              x-redefines: CODATECN-0UT-DATE
          required:
          - codatecnOuttype
          - codatecn0utDate
          - codatecn1out
          - codatecn2out
        codatecnErrorMsg:
          type: string
          maxLength: 38
          x-cobol-pic: X(38)
      required:
      - codatecnInRec
      - codatecnOutRec
      - codatecnErrorMsg
