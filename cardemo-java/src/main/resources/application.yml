spring:
  application:
    name: cardemo-java

  profiles:
    active: dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:carddemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/carddemo}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:carddemo}
    password: ${DATABASE_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

---
# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
