server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth Service — ports COSGN00C sign-on
        - id: auth-service-login
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # Auth Service — ports COUSR00C-03C user management
        - id: auth-service-users
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        # Card Service — cards by account route (must be before account-service to match first)
        - id: card-service-by-account
          uri: http://localhost:8083
          predicates:
            - Path=/api/accounts/*/cards
          filters:
            - StripPrefix=0

        # Account Service — ports COACTVWC/COACTUPC
        - id: account-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=0

        # Card Service — ports COCRDLIC/COCRDSLC/COCRDUPC
        - id: card-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/cards/**
          filters:
            - StripPrefix=0

        # Transaction Service — ports COTRN00C-02C
        - id: transaction-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=0

        # Billing Service — ports COBIL00C
        - id: billing-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/billing/**
          filters:
            - StripPrefix=0

        # Report Service — ports CORPT00C/CBSTM03A
        - id: report-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/reports/**
          filters:
            - StripPrefix=0

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
