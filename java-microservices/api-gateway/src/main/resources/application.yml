server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: user-admin-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/admin/**
        - id: account-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/accounts/**
        - id: card-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/cards/**
        - id: transaction-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/transactions/**,/api/billing/**,/api/transaction-types/**
        - id: report-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/reports/**
jwt:
  secret: ${JWT_SECRET:changeme}
