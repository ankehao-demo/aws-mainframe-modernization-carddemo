spring:
  application:
    name: carddemo

  datasource:
    url: jdbc:postgresql://localhost:5432/carddemo
    username: carddemo
    password: carddemo
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: CardDemoSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!
    expiration-ms: 3600000
  batch:
    output-dir: ./batch-output
    cron:
      nightly-chain: "0 0 2 * * ?"
