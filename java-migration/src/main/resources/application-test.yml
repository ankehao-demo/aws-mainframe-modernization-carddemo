spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway:
    enabled: false

  batch:
    jdbc:
      initialize-schema: embedded
    job:
      enabled: false

  rabbitmq:
    host: localhost
    port: 5672

app:
  jwt:
    secret: TestSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLongForTesting!!
    expiration-ms: 3600000
  batch:
    output-dir: ./target/batch-output
    cron:
      nightly-chain: "-"
